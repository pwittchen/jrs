# The real-project corpus (specs/todo/CORPUS.md): what `cargo bench --bench
# corpus` takes through `jrs migrate`, `build`, `test`, `run` and `package`,
# and checks against the project's own Maven or Gradle build. jrs never reads
# this file.
#
#   name     the row in the report, and the directory under target/corpus/<run>/
#   repo     cloned at `commit`, always a full hash: moving a pin is a commit of
#            its own, with the outcome before and after in its message
#   dir      where the build file is, inside the clone
#   build    "maven" or "gradle": what `jrs migrate --from` gets, and the reference
#   kind     spring-boot | ktor | service | workspace
#   jdk      the oldest release it is run on; an older host JDK skips the project
#   run      how to tell the application started: `probe` (a URL) and `expect`
#            (the status), or `stdout` (a substring of its output); none skips
#            `run`. `package` says the same of `java -jar` on the fat jar
#   member   in a workspace, the member `run` and `package` start
#   needs    what the host must have; today only "docker". Without it the tests
#            are skipped on both sides, and `test` is `skip`
#   known    a step's failure that FINDINGS.md explains: `{ test = 9 }` prints
#            F9 instead of FAIL. Removed when the finding is closed
#   exclude  test classes left out of the comparison on both sides, each with
#            a reason in FINDINGS.md

# Spring Boot, Java, Maven

[[project]]
name = "petclinic-maven"
repo = "https://github.com/spring-projects/spring-petclinic"
commit = "500158f732419217507c7656904b8e6aa1bcc0d6"
dir = "."
build = "maven"
kind = "spring-boot"
jdk = 17
run = { probe = "http://localhost:8080/", expect = 200 }
package = { fat = true, probe = "http://localhost:8080/", expect = 200 }
needs = ["docker"]
known = { build = 6 }

[[project]]
name = "rest-service-maven"
repo = "https://github.com/spring-guides/gs-rest-service"
commit = "3f4cef01152596c19bc4d37939409358812b1421"
dir = "complete"
build = "maven"
kind = "spring-boot"
jdk = 17
run = { probe = "http://localhost:8080/greeting", expect = 200 }
package = { fat = true, probe = "http://localhost:8080/greeting", expect = 200 }

[[project]]
name = "data-jpa-maven"
repo = "https://github.com/spring-guides/gs-accessing-data-jpa"
commit = "ef48947528dba9021776282e12299e5298e66bca"
dir = "complete"
build = "maven"
kind = "spring-boot"
jdk = 17
run = { stdout = "Customers found with findAll()" }
package = { fat = true, stdout = "Customers found with findAll()" }

