[project]
name = "gradle-app"
version = "3.0.0"
main-class = "com.example.GradleMain"

[java]
source = 21
javac-args = ["-proc:full"]

[dependencies]
"com.google.guava:guava" = "33.0.0-jre"
"org.apache.commons:commons-lang3" = "3.14.0"
"org.slf4j:slf4j-api" = "2.0.12"
"org.projectlombok:lombok" = { version = "1.18.30", compile-only = true }

[dev-dependencies]
"org.junit.jupiter:junit-jupiter" = "5.10.2"

[repositories]
"nexus" = "https://nexus.example.com/repository/maven-public"

[tasks.checkstyle]
description = "Check the Java sources with Checkstyle (config/checkstyle/checkstyle.xml)"
main = "com.puppycrawl.tools.checkstyle.Main"
args = ["-c", "config/checkstyle/checkstyle.xml", "src/main/java"]

[tasks.checkstyle.dependencies]
"com.puppycrawl.tools:checkstyle" = "12.3.1"

[hooks]
post-compile = ["checkstyle"]
