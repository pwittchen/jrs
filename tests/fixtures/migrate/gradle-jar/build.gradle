plugins {
    id 'java'
}

version = '2.0.0'

java {
    withSourcesJar()
    withJavadocJar()
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Jar Demo',
            'Implementation-Version': version,
            'Automatic-Module-Name': 'com.example.jardemo',
            'Main-Class': 'com.example.JarDemo',
            'Built-By': System.getProperty('user.name'),
            'Class-Path': 'lib/extra.jar'
        )
        attributes 'Premain-Class': 'com.example.Agent',
                   'Can-Redefine-Classes': 'true'
    }
}
