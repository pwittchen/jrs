[project]
name = "extras"
version = "0.9.0"

[java]
source = 21
javac-args = ["-proc:full"]

[test]
jvm-args = ["-Xmx512m", "-Dfile.encoding=UTF-8", "-Denv=test"]

[dependencies]
"org.lwjgl:lwjgl" = "3.3.3"
"org.lwjgl:lwjgl:natives-linux" = "3.3.3"
"com.google.guava:guava" = { version = "33.0.0-jre", exclusions = ["com.google.code.findbugs:jsr305", "org.checkerframework:*"] }
"org.projectlombok:lombok" = { version = "1.18.34", compile-only = true }

[dev-dependencies]
"com.example:shared-fixtures:tests" = "1.0.0"
"junit:junit" = "4.13.2"
