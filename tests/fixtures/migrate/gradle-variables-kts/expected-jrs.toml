[project]
name = "variables-kts-app"
version = "1.4.0"
main-class = "com.example.VariablesApp"

[java]
source = 21
javac-args = ["-parameters", "-proc:full"]

[managed]
"org.springframework.boot:spring-boot-dependencies" = { version = "3.5.4", bom = true }
"org.springframework.cloud:spring-cloud-dependencies" = { version = "2025.0.0", bom = true }
"org.testcontainers:testcontainers-bom" = { version = "1.21.3", bom = true }
"org.junit:junit-bom" = { version = "5.13.4", bom = true }
"org.yaml:snakeyaml" = "2.4"

[dependencies]
"org.springframework.boot:spring-boot-starter-web" = {}
"com.google.guava:guava" = "33.4.8-jre"
"org.slf4j:slf4j-api" = "2.0.17"
"io.netty:netty-codec-http" = "4.2.4.Final"
"io.netty:netty-transport-native-epoll:linux-x86_64" = { version = "4.2.4.Final", runtime-only = true }
"com.fasterxml.jackson.core:jackson-databind" = "2.19.2"
"org.projectlombok:lombok" = { version = "1.18.38", compile-only = true }

[dev-dependencies]
"org.junit.jupiter:junit-jupiter" = {}
"org.testcontainers:postgresql" = {}
