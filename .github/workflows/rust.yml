name: Rust

on:
  # Documentation-only and website-only changes cannot break the build, so they
  # do not run it; website.yml publishes the site. Path filters are not
  # evaluated for tag pushes, so a version tag always runs the full pipeline
  # and then publishes a release (see `dist`).
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'website/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'website/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    # Classpath separators, `.exe` suffixes, `%LOCALAPPDATA%` and drive-letter
    # paths are only exercised where they occur, so every platform jrs ships a
    # binary for runs the whole suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    # The integration tests build fixture Java projects, so they need a JDK.
    # jrs itself requires 17 or newer.
    - name: Set up the JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    # setup-java registers problem matchers that turn javac and JVM error lines
    # into annotations. Here those lines only come from test fixtures that fail
    # on purpose, so the annotations are noise on a green build.
    - name: Drop the Java problem matchers
      run: |
        echo "::remove-matcher owner=javac::"
        echo "::remove-matcher owner=java::"
        echo "::remove-matcher owner=maven-javac::"

    # Formatting does not depend on the platform; checking it once is enough.
    - name: Check formatting
      if: runner.os == 'Linux'
      run: cargo fmt --check

    - name: Lint
      run: cargo clippy --all-targets -- -D warnings

    - name: Build
      run: cargo build --verbose

    # The default test run is hermetic: dependency resolution is exercised
    # against a file:// repository fixture, not Maven Central.
    - name: Run tests
      run: cargo test --verbose

    # The tests that do reach Maven Central are gated behind a feature flag.
    # They exercise the network, not the platform, so Linux alone runs them.
    - name: Run the network tests
      if: runner.os == 'Linux'
      run: cargo test --verbose --features network-tests --test network

  # Byte-identical jars are load-bearing, and unit tests only see jrs's own
  # writer. Each example — Java, Kotlin, Scala, Groovy and a Spring Boot
  # service, with the real compilers — is built twice, from two checkouts at
  # different paths and without the build cache, and everything `jrs package`
  # writes is compared byte for byte: a compiler that records a path or a
  # time fails here.
  reproducible:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up the JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Build jrs
      run: cargo build --release --locked

    - name: Build each example twice and compare
      run: |
        set -euo pipefail
        jrs="$PWD/target/release/jrs"
        work="$RUNNER_TEMP/reproducible"
        export JRS_CACHE_DIR="$work/cache"
        failed=0
        for example in examples/*/; do
          name=$(basename "$example")
          a="$work/a/$name"
          b="$work/b/somewhere/deeper/$name"
          for dir in "$a" "$b"; do
            mkdir -p "$(dirname "$dir")"
            cp -R "$example" "$dir"
            rm -rf "$dir/target"
            run() { "$jrs" --manifest-path "$dir" --progress never package --no-build-cache "$@"; }
            # A fat jar and the portable one share a name, so each set is
            # kept before the next build.
            run --portable --sources --dist --sbom
            mkdir -p "$dir.out/portable" "$dir.out/fat"
            cp -R "$dir/target/lib" "$dir"/target/*.jar "$dir"/target/*.zip \
              "$dir"/target/*-cyclonedx.json "$dir.out/portable/"
            run --fat
            cp "$dir"/target/*.jar "$dir.out/fat/"
          done
          files=$(cd "$a.out" && find . -type f | sort)
          if [ "$files" != "$(cd "$b.out" && find . -type f | sort)" ]; then
            echo "::error::$name: the two builds wrote different files"
            failed=1
            continue
          fi
          differ=0
          while read -r file; do
            if ! cmp -s "$a.out/$file" "$b.out/$file"; then
              echo "::error::$name: ${file#./} differs between the two builds"
              differ=1
            fi
          done <<< "$files"
          if [ "$differ" = 0 ]; then
            echo "$name: $(wc -l <<< "$files" | tr -d ' ') files, byte for byte the same"
          fi
          failed=$((failed | differ))
        done
        exit "$failed"

  # A version tag sets the crate version: `v1.2.3` writes `version = "1.2.3"` to
  # Cargo.toml and Cargo.lock and commits that to master, so the release is
  # built from sources that report its version. The tag itself is left where it
  # was pushed, so a local clone never holds a stale copy of it.
  # Pushes made with the workflow's own token do not trigger further runs.
  bump:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check the tag
      run: |
        version="${GITHUB_REF_NAME#v}"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::tag $GITHUB_REF_NAME is not of the form v<major>.<minor>.<patch>"
          exit 1
        fi
        # The bump is pushed to master, which only works as a fast-forward.
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
          echo "::error::tag $GITHUB_REF_NAME must point at the tip of master"
          exit 1
        fi

    - name: Set the version and commit it
      id: commit
      run: |
        version="${GITHUB_REF_NAME#v}"
        sed -i "0,/^version = \".*\"$/s//version = \"$version\"/" Cargo.toml
        cargo update --workspace
        if git diff --quiet; then
          echo "Cargo.toml is already at $version"
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $version"
          git push origin HEAD:master
        fi
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Prebuilt binaries, built from the version commit. Asset names carry no
  # version, so `releases/latest/download/<asset>` is a stable URL for the
  # installation instructions in DOCS.md and for website/install.sh, which
  # also reads SHA256SUMS. Renaming an asset breaks that script.
  dist:
    needs: bump

    strategy:
      matrix:
        include:
          # Linux binaries link musl statically, so they run on any distribution
          # regardless of its glibc version.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.bump.outputs.sha }}

    - name: Add the Rust target
      run: rustup target add ${{ matrix.target }}

    # ring compiles C for the target, which needs a musl-aware compiler.
    - name: Install musl tools
      if: contains(matrix.target, 'linux-musl')
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        target='${{ matrix.target }}'
        echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"

    # ring compiles its assembly for Windows on Arm with clang alone, which
    # the image has under Program Files but not on PATH.
    - name: Put clang on PATH
      if: matrix.target == 'aarch64-pc-windows-msvc'
      run: |
        if ! command -v clang >/dev/null; then
          echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
        fi

    # Link the MSVC runtime statically, so the binary does not depend on the
    # Visual C++ redistributable being installed.
    - name: Link the C runtime statically
      if: contains(matrix.target, 'windows')
      run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

    - name: Build the release binary
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Package
      env:
        TARGET: ${{ matrix.target }}
      run: |
        mkdir -p dist
        cp LICENSE "target/$TARGET/release/"
        cd "target/$TARGET/release"
        if [[ "$TARGET" == *windows* ]]; then
          7z a "$GITHUB_WORKSPACE/dist/jrs-$TARGET.zip" jrs.exe LICENSE
        else
          tar -czf "$GITHUB_WORKSPACE/dist/jrs-$TARGET.tar.gz" jrs LICENSE
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: jrs-${{ matrix.target }}
        path: dist/*
        if-no-files-found: error

  release:
    needs: dist
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Write checksums
      working-directory: dist
      run: sha256sum -- * > SHA256SUMS

    # The Homebrew formula, the Scoop manifest and the winget manifest for
    # this release, from its checksums; publishing them to the tap, the
    # bucket and winget-pkgs is a step the maintainer takes.
    - uses: actions/checkout@v7
      with:
        path: source
        sparse-checkout: packaging

    - name: Write the package manager manifests
      run: sh source/packaging/manifests.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS manifests

    - uses: actions/upload-artifact@v7
      with:
        name: package-manifests
        path: manifests
        if-no-files-found: error

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # The website shows the crate version, and the version commit pushed by
  # `bump` triggers no workflow of its own, so the site is republished from it
  # here, once the release it links to exists. A called workflow sees no
  # secrets unless they are passed on, and it needs the VPS ones to deploy.
  website:
    needs: [ bump, release ]

    permissions:
      contents: read

    uses: ./.github/workflows/website.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
    secrets: inherit
