name: Benchmarks

# jrs against Maven and Gradle (specs/BENCHMARKS.md §7): the parity set
# built, tested, run and packaged by each tool from a local mirror, on two
# JDKs. Manual only, and it commits nothing: a shared runner is noisy, so its
# report is for spotting a regression between two jrs commits, not for the
# Why page, which takes its numbers from one reference machine.
on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects: `all`, or names from benches/compare.rs and docs/corpus/corpus.toml, comma-separated'
        default: 'wordstats,bookmarks,gen-300,gen-2000,gen-ws'
        required: true
      scenarios:
        description: 'Scenarios: `all`, or ids from BENCHMARKS.md §4, comma-separated'
        default: 'all'
        required: true
      runs:
        description: 'Measured runs per cell'
        default: '7'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '25']

    steps:
    - uses: actions/checkout@v7

    - name: Set up the JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ matrix.jdk }}

    - name: Set up Maven
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: '3.9.11'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '9.1.0'
        cache-disabled: true

    # The project list and the build files decide what the mirror holds.
    - name: Restore the mirror
      id: mirror
      uses: actions/cache@v4
      with:
        path: ~/.cache/jrs-bench
        key: jrs-bench-mirror-${{ hashFiles('benches/compare.rs', 'benchmarks/projects/**') }}

    # The only step that reaches the network.
    - name: Record the mirror
      if: steps.mirror.outputs.cache-hit != 'true'
      env:
        JRS_BENCH_RECORD: '1'
        JRS_BENCH_PROJECTS: ${{ inputs.projects }}
      run: cargo bench --bench compare

    - name: Run the benchmark
      env:
        JRS_BENCH_PROJECTS: ${{ inputs.projects }}
        JRS_BENCH_SCENARIOS: ${{ inputs.scenarios }}
        JRS_BENCH_RUNS: ${{ inputs.runs }}
      run: cargo bench --bench compare

    - name: Write the report to the job summary
      if: always()
      run: cat benchmarks/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmarks-jdk-${{ matrix.jdk }}
        path: |
          benchmarks/REPORT.md
          benchmarks/raw/
          target/compare/*/logs/
        if-no-files-found: ignore
