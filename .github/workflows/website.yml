name: Website

# Builds website/ with Bun and publishes it to GitHub Pages.
#
# A change under website/ publishes it on its own. The version in the header is
# read from Cargo.toml at build time, and a release sets that version in a
# commit pushed with the workflow token, which triggers no further runs, so the
# release pipeline in rust.yml calls this workflow once the release is out.
on:
  push:
    branches: [ "master" ]
    paths:
      - 'website/**'
      - '!website/README.md'
      - 'logo.png'
      - '.github/workflows/website.yml'
  workflow_call:
    inputs:
      ref:
        description: The commit to build the site from.
        required: true
        type: string
  workflow_dispatch:

# One deployment at a time; a queued one waits rather than cancelling a
# deployment halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: website

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.sha }}

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.6'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    # dist/ links its assets relatively, so it works under the /jrs/ path
    # GitHub Pages serves a project site from.
    - name: Build the site
      run: bun run build

    - uses: actions/upload-pages-artifact@v5
      with:
        path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
