[project]
name = "calc"
version = "1.0.0"
main-class = "com.example.calc.Main"

[java]
source = 17
javac-args = ["-Xlint:all"]

[scala]
# Scala 3.8 and later: scala3-library_3 and scala-library are both implied
version = "3.9.0"
scalac-args = ["-deprecation", "-feature", "-Werror"]

[dev-dependencies]
# a JUnit 4 runner: it brings junit:junit, so tests run on the Vintage engine
"org.scalameta:munit_3" = "1.3.6"
