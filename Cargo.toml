[package]
name = "jrs"
version = "0.14.8"
edition = "2024"

[features]
# Tests that talk to Maven Central. Off by default so `cargo test` stays hermetic.
network-tests = []

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
quick-xml = "0.42.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
terminal_size = "0.4.4"
thiserror = "2.0.20"
toml = { version = "1.1.5", features = ["preserve_order"] }
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

# SPEC §12, M5: resolution against a latency-injecting local repository, in both
# progress modes. A plain `main`, so no benchmarking crate is needed.
[[bench]]
name = "resolution"
harness = false

# SPEC §7.2: rebuild time after a one-file change, and how much of it is javac.
[[bench]]
name = "incremental"
harness = false

# specs/GRADLE_GAPS.md §3.1: what `kotlinc` costs on a real project,
# by JRS_BENCH_PROJECT, and what a warm one saves.
[[bench]]
name = "kotlinc"
harness = false

# SPEC §10.2: `test.share-classes` on a real project, by JRS_BENCH_PROJECT:
# the test JVM in each mode, and whether its outcome changed.
[[bench]]
name = "test_jvm"
harness = false

# ROADMAP_ARCHIVE §1, specs/CORPUS.md: the real-project corpus, by JRS_CORPUS,
# through migrate, build, test, run and package against its own build.
[[bench]]
name = "corpus"
harness = false

# ROADMAP_ARCHIVE §2, specs/BENCHMARKS.md: jrs, Maven and Gradle on the same
# projects, from a local mirror, checked to be the same build before timing.
[[bench]]
name = "compare"
harness = false
