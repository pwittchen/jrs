[package]
name = "jrs"
version = "0.1.0"
edition = "2024"

[features]
# Tests that talk to Maven Central. Off by default so `cargo test` stays hermetic.
network-tests = []

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
quick-xml = "0.42.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
terminal_size = "0.4.4"
thiserror = "2.0.20"
toml = { version = "1.1.5", features = ["preserve_order"] }
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
